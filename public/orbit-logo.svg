<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orbit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbit-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#orbit-bg)"/>
  
  <!-- Outer glowing orbit ring -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="url(#orbit-ring)" stroke-width="8" opacity="0.8" transform="rotate(-30 256 256)" filter="url(#glow)"/>

  <!-- Satellite on orbit ring -->
  <circle cx="390" cy="180" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="120" cy="330" r="10" fill="#ec4899" filter="url(#glow)"/>

  <!-- Central core planet with gradient and soundwave aura -->
  <circle cx="256" cy="256" r="85" fill="url(#orbit-grad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="80" fill="#0a0d14"/>

  <!-- Soundwave / Radio Wave Icon in center -->
  <g fill="none" stroke="url(#orbit-grad)" stroke-width="8" stroke-linecap="round">
    <!-- Center antenna dot -->
    <circle cx="256" cy="256" r="12" fill="#6366f1"/>
    <!-- Wave arches -->
    <path d="M 220 220 A 50 50 0 0 0 220 292" />
    <path d="M 292 220 A 50 50 0 0 1 292 292" />
    <path d="M 195 195 A 86 86 0 0 0 195 317" opacity="0.7"/>
    <path d="M 317 195 A 86 86 0 0 1 317 317" opacity="0.7"/>
  </g>
</svg>
