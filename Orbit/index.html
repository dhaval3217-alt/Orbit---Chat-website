<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/orbit-logo.svg" />
    <link rel="apple-touch-icon" href="/orbit-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Mobile Viewport & Notch / Safe-Area Ergonomics -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>Orbit – Real-Time Social Audio & Matching</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css' rel='stylesheet' />
  </head>
  <body class="bg-[#0a0d14] text-slate-100 min-h-screen font-sans selection:bg-indigo-500/30 selection:text-indigo-200 antialiased overscroll-none select-none md:select-auto">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const isSecure = window.location.protocol === 'https:';
        const isLocal = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
        if (isSecure || isLocal) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              // When a new SW is found, activate it immediately
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New version ready — reload all clients to flush the old cache
                      navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
                      window.location.reload();
                    }
                  });
                }
              });
            }).catch(console.warn);
            // Reload if the controller changes (new SW took over)
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (!refreshing) { refreshing = true; window.location.reload(); }
            });
          });
        }
      }
    </script>
  </body>
</html>
